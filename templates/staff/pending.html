{% extends 'base.html' %}

{% block title %}
Pending Approval Page
{% endblock %}

{% block styles %}
<style>
    .pending-card {
        max-width: 470px;
        min-height: 275px;
        text-align: center;
        padding: 2rem;
    }
    .pending-card h1 {
        margin: 0;
        color: var(--color-danger);
    }
</style>
{% endblock %}

{% block content %}
<section class="main-container auth-layout">

    <div class="form-card pending-card shadow d-flex flex-column justify-content-center align-items-center">

        <h1 class="fw-bold mb-3">
            Approval Pending
        </h1>
        <p>
            Your staff account is currently under review.
            Please wait for admin approval before accessing the dashboard.
        </p>
        <a href="{{ url_for('auth.logout') }}" class="btn btn-muted-custom mt-2">
            <i class="bi bi-box-arrow-right me-2"></i>
            Logout
        </a>

    </div>

</section>
{% endblock %}
