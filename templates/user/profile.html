{% extends 'user/user_base.html' %}

{% block page_title %}
Profile
{% endblock %}

{% block user_content %}
<div class="container-fluid py-3">

    <div class="mb-3">
        <h2 class="fw-semibold mb-1">
            My Profile
        </h2>
        <p class="mb-0 text-muted">
            Update your personal information and account settings.
        </p>
    </div>


    <div class="row justify-content-center g-4 p-3">

        <!-- Update Personal Information -->
        <div class="col-lg-4">

            <div class="card shadow h-100">

                <div class="card-header py-3">
                    <h4 class="fw-semibold mb-0">
                        Personal Information
                    </h4>
                </div>

                <div class="card-body p-4">

                    <form method="POST" action="{{ url_for('user.profile') }}">

                        <div class="mb-3">
                            <label class="form-label">
                                Name
                            </label>
                            <input type="text" name="name" class="form-control" value="{{ current_user.name }}"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Contact Number
                            </label>
                            <input type="text" name="contact_no" class="form-control"
                                value="{{ current_user.contact_no }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Email Address
                            </label>
                            <input type="email" class="form-control" value="{{ current_user.email }}" disabled>
                            <small class="text-muted">
                                Email cannot be changed.
                            </small>
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-user">
                                <i class="bi bi-check-lg me-2"></i>
                                Update
                            </button>
                        </div>

                    </form>

                </div>

            </div>

        </div>


        <!-- Change Password -->
        <div class="col-lg-4">

            <div class="card shadow h-100">

                <div class="card-header py-3">
                    <h4 class="fw-semibold mb-0">
                        Change Password
                    </h4>
                </div>

                <div class="card-body p-4">

                    <form method="POST" action="{{ url_for('user.profile') }}">

                        <!-- Hidden fields carry name and contact so validation passes -->
                        <input type="hidden" name="name" value="{{ current_user.name }}">
                        <input type="hidden" name="contact_no" value="{{ current_user.contact_no }}">

                        <div class="mb-3">
                            <label class="form-label">
                                Current Password
                            </label>
                            <input type="password" name="current_password" class="form-control"
                                placeholder="Enter your current password">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                New Password
                            </label>
                            <input type="password" name="new_password" class="form-control"
                                placeholder="Enter your new password">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Confirm New Password
                            </label>
                            <input type="password" name="confirm_password" class="form-control"
                                placeholder="Confirm your new password">
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-user">
                                <i class="bi bi-check-lg me-2"></i>
                                Update Password
                            </button>
                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>
{% endblock %}
