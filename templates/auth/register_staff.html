{% extends 'base.html' %}

{% block title %}
Register Staff Page
{% endblock %}


{% block styles %}
<style>
    .form-card {
        max-width: 530px;
        transform: scale(0.925);
        transform-origin: center;
    }
</style>
{% endblock %}


{% block content %}
<section class="main-container auth-layout">

    <div class="form-card shadow-sm">

        <div class="text-center mb-4">
            <h1 class="h3 mb-0">Register as Trek Staff</h1>
            <p class="text-muted mb-0">
                Join our team and guide trekking adventures.
            </p>
        </div>

        <!-- Register Form -->
        <form method="POST" action="{{ url_for('auth.register_staff') }}">

            <!-- Row 1 -->
            <div class="mb-3">
                <label for="name" class="form-label">
                    <i class="bi bi-person"></i>
                    Full Name
                </label>
                <input type="text" id="name" name="name" class="form-control"
                    placeholder="Enter your full name" required>
            </div>

            <!-- Row 2 -->
            <div class="row g-2 mb-2">

                <div class="col-md-6">
                    <label for="email" class="form-label">
                        <i class="bi bi-envelope-check"></i>
                        Email Address
                    </label>
                    <input type="email" id="email" name="email" class="form-control"
                        placeholder="Enter your email" required>
                </div>

                <div class="col-md-6">
                    <label for="contact_no" class="form-label">
                        <i class="bi bi-telephone"></i>
                        Contact Number
                    </label>
                    <input type="text" id="contact_no" name="contact_no" class="form-control"
                        placeholder="Enter your contact number" required>
                </div>

            </div>

            <!-- Row 3 -->
            <div class="row g-2 mb-2">

                <div class="col-md-6">
                    <label for="password" class="form-label">
                        <i class="bi bi-shield-check"></i>
                        Password
                    </label>
                    <input type="password" id="password" name="password" class="form-control"
                        placeholder="Enter your password" required>
                </div>

                <div class="col-md-6">
                    <label for="confirm_password" class="form-label">
                        <i class="bi bi-check-circle"></i>
                        Confirm Password
                    </label>
                    <input type="password" id="confirm_password" name="confirm_password"
                        class="form-control" placeholder="Confirm your password" required>
                </div>

            </div>

            <!-- Row 4 -->
            <div class="text-end mb-3">
                <label for="bio" class="form-label">
                    <i class="bi bi-card-text"></i>
                    Bio (Optional)
                </label>
                <textarea id="bio" name="bio" class="form-control" rows="3"
                    placeholder="Tell us about your trekking experience"></textarea>
            </div>

            <button type="submit" class="btn btn-staff w-100 mb-4">
                <i class="bi bi-person-workspace me-2"></i>
                Register as Staff
            </button>

        </form>

        <!-- Register User Link and Login Link -->
        <div class="text-center">

            <p class="mb-1">
                Want to trek with us?
                <a href="{{ url_for('auth.register_user') }}">
                    Create User Account
                </a>
            </p>

            <p class="mb-0">
                Already have an account?
                <a href="{{ url_for('auth.login') }}">
                    Login Here
                </a>
            </p>

        </div>

    </div>

</section>
{% endblock %}
