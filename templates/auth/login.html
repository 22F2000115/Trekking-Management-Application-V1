{% extends 'base.html' %}

{% block title %}
Login Page
{% endblock %}

{% block styles %}
<style>
    .form-card {
        max-width: 375px;
    }
</style>
{% endblock %}

{% block content %}
<section class="main-container auth-layout">

    <div class="form-card shadow">

        <div class="text-center mb-4">
            <h1 class="h3 mb-0">Welcome Back</h1>
            <p class="text-muted mb-0">
                Login to continue your trekking journey.
            </p>
        </div>


        <form method="POST" action="{{ url_for('auth.login') }}">

            <div class="mb-3">
                <label for="email" class="form-label">
                    <i class="bi bi-envelope-check"></i>
                    Email Address
                </label>
                <input type="email" id="email" name="email" class="form-control"
                    placeholder="Enter your email" required>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">
                    <i class="bi bi-shield-check"></i>
                    Password
                </label>
                <input type="password" id="password" name="password" class="form-control"
                    placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 mb-4">
                <i class="bi bi-box-arrow-in-right me-2"></i>
                Login
            </button>

        </form>

        
        <div class="small text-center">

            <p class="mb-1">
                New Trekker?
                <a href="{{ url_for('auth.register_user') }}">
                    Create User Account
                </a>
            </p>

            <p class="mb-0">
                Want to join as Trek Staff?
                <a href="{{ url_for('auth.register_staff') }}">
                    Register as Staff
                </a>
            </p>

        </div>

    </div>
</section>
{% endblock %}
