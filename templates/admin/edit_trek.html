{% extends 'admin/admin_base.html' %}

{% block page_title %}
Edit Trek
{% endblock %}

{% block admin_content %}
<div class="container-fluid py-3">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 class="mb-1">
                Edit Trek
            </h2>
            <p class="text-muted mb-0">
                Update trek details. Staff assignment and status are managed from the Treks list.
            </p>
        </div>

        <a href="{{ url_for('admin.treks') }}" class="btn btn-admin">
            <i class="bi bi-caret-left-fill me-2"></i>
            Back to Treks
        </a>
    </div>


    <div class="card shadow-sm">
        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">
                        Trek Name
                    </label>

                    <input type="text" name="name" class="form-control" value="{{ trek.name }}" required>
                </div>


                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Location
                        </label>

                        <input type="text" name="location" class="form-control" value="{{ trek.location }}" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Difficulty
                        </label>

                        <select name="difficulty" class="form-select" required>
                            {% for difficulty in trek_difficulties %}
                            <option value="{{ difficulty }}" {% if trek.difficulty==difficulty %}selected{% endif %}>
                                {{ difficulty }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>


                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Duration (Days)
                        </label>

                        <input type="number" name="duration" class="form-control" value="{{ trek.duration }}" min="1"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Price (₹)
                        </label>

                        <input type="number" step="0.01" name="price" class="form-control" value="{{ trek.price }}"
                            required>
                    </div>
                </div>


                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Total Slots
                        </label>

                        <input type="number" name="total_slots" class="form-control" value="{{ trek.total_slots }}"
                            min="1" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Available Slots
                        </label>

                        <input type="number" name="available_slots" class="form-control"
                            value="{{ trek.available_slots }}" min="0" required>
                    </div>
                </div>


                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Start Date
                        </label>

                        <input type="date" name="start_date" class="form-control" value="{{ trek.start_date }}"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            End Date
                        </label>

                        <input type="date" name="end_date" class="form-control" value="{{ trek.end_date }}" required>
                    </div>
                </div>


                <div class="mb-4">
                    <label class="form-label">
                        Description
                    </label>

                    <textarea name="description" rows="5" class="form-control">{{ trek.description or '' }}</textarea>
                </div>


                <div class="d-flex justify-content-end gap-2">
                    <a href="{{ url_for('admin.treks') }}" class="btn btn-muted-custom">
                        Cancel
                    </a>

                    <button type="submit" class="btn btn-admin">
                        <i class="bi bi-check-lg me-2"></i>
                        Update Trek
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>
{% endblock %}
