{% extends 'admin/admin_base.html' %}

{% block page_title %}
Add Trek
{% endblock %}

{% block admin_content %}
<div class="container-fluid py-3">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 class="mb-1">
                Add New Trek
            </h2>
            <p class="text-muted mb-0">
                Create a new trekking activity and assign a trek staff.
            </p>
        </div>

        <a href="{{ url_for('admin.treks') }}" class="btn btn-admin">
            <i class="bi bi-caret-left-fill me-2"></i>
            Back to Treks
        </a>
    </div>


    <div class="card shadow-sm">
        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">
                        Trek Name
                    </label>
                    <input type="text" name="name" class="form-control" placeholder="Enter trek name" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Location
                        </label>
                        <input type="text" name="location" class="form-control" placeholder="Enter trek location"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Difficulty
                        </label>

                        <select name="difficulty" class="form-select" required>
                            <option value="" selected disabled>
                                Select Difficulty
                            </option>

                            {% for difficulty in trek_difficulties %}
                            <option value="{{ difficulty }}">
                                {{ difficulty }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Duration (Days)
                        </label>

                        <input type="number" name="duration" class="form-control" min="1" placeholder="Number of days"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Price (₹)
                        </label>

                        <input type="number" name="price" class="form-control" step="0.01" min="0"
                            placeholder="Trek price" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Total Slots
                        </label>

                        <input type="number" name="total_slots" class="form-control" min="1"
                            placeholder="Maximum participants" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Assign Staff
                        </label>

                        <select name="assigned_staff_id" class="form-select">
                            <option value="">
                                -- Unassigned --
                            </option>

                            {% for staff in approved_staff %}
                            <option value="{{ staff.id }}">
                                {{ staff.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Start Date
                        </label>

                        <input type="date" name="start_date" class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            End Date
                        </label>

                        <input type="date" name="end_date" class="form-control" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">
                        Description
                    </label>

                    <textarea name="description" class="form-control" rows="5"
                        placeholder="Write a short description about the trek..."></textarea>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="{{ url_for('admin.treks') }}" class="btn btn-muted-custom">
                        Cancel
                    </a>

                    <button type="submit" class="btn btn-admin">
                        <i class="bi bi-plus-lg me-2"></i>
                        Create Trek
                    </button>
                </div>

            </form>

        </div>

    </div>

</div>
{% endblock %}
