{% extends 'base.html' %}

{% block title %}
403 Forbidden Page
{% endblock %}

{% block styles %}
<style>
    .error-card {
        max-width: 475px;
        min-height: 300px;
    }
    .error-card h1 {
        font-family: var(--font-body);
        margin: 0;
    }
    .error-code {
        color: var(--color-danger);
    }
</style>
{% endblock %}

{% block content %}
<section class="main-container auth-layout">

    <div class="form-card error-card shadow d-flex flex-column justify-content-center align-items-center">
        <h1 class="error-code display-2 fw-bold">
            403
        </h1>
        <h2 class="fw-bold">
            Access Denied
        </h2>
        <p>
            You do not have permission to access this page.
        </p>
        <a href="{{ url_for('auth.login') }}" class="btn btn-muted-custom mt-2">
            <i class="bi bi-box-arrow-in-right me-2"></i>
            Login
        </a>
    </div>

</section>
{% endblock %}
